<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Portal (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #1c2631; --muted: #5a6977; --line: #d9e0e6;
  --accent: #0d6a87; --accent-soft: #e3f0f4; --good: #2b7a4b; --warn-bg: #fff6e0; --warn-ink: #7a5300;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12181e; --surface: #1a222a; --ink: #e6ecf1; --muted: #9aa8b4; --line: #2c3742;
    --accent: #5bb6d3; --accent-soft: #19323c; --good: #5cc28a; --warn-bg: #3a2f14; --warn-ink: #f2d38b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--accent); color: #fff; }
.brand { font-weight: 600; font-size: 15px; white-space: nowrap; }
.demo-badge { font-size: 12px; padding: 2px 8px; border: 1px solid rgba(255,255,255,.6); border-radius: 4px; white-space: nowrap; }
.search { flex: 1; max-width: 520px; margin: 0 auto; }
.search input { width: 100%; height: 30px; border: 0; border-radius: 4px; padding: 0 10px; font: inherit; }
.user { font-size: 13px; white-space: nowrap; }

.shell { display: flex; min-height: calc(100% - 48px); }
.nav { width: 210px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); padding: 12px 0; }
.nav a { display: block; padding: 8px 20px; color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 17px; font-weight: 500; }
.nav .disabled { color: var(--muted); padding: 8px 20px; display: block; }
main { flex: 1; padding: 16px 28px 40px; min-width: 0; }
main:focus { outline: none; }

.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
.subtitle { color: var(--muted); margin: 2px 0 12px; }
.commands { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 16px; }
.cmd { font: inherit; background: none; border: 1px solid transparent; border-radius: 4px; padding: 5px 10px; color: var(--ink); cursor: pointer; }
.cmd:hover:not(:disabled) { background: var(--accent-soft); }
.cmd:disabled { color: var(--muted); cursor: not-allowed; }
.cmd.primary { color: var(--accent); font-weight: 500; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; margin-bottom: 16px; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
.essentials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 40px; margin: 0; }
.essentials div { display: grid; grid-template-columns: 150px 1fr; gap: 8px; }
.essentials dt { color: var(--muted); }
.essentials dd { margin: 0; overflow-wrap: anywhere; }
.status-running { color: var(--good); font-weight: 500; }
.status-running::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; background: var(--bg); }
.tag b { font-weight: 500; }

.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; }
.form { display: grid; gap: 14px; max-width: 560px; }
.form label { display: grid; gap: 4px; font-weight: 500; }
.form input, .form select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs span { padding: 6px 0; color: var(--muted); }
.tabs span.on { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 500; }
.btn { font: inherit; border-radius: 4px; padding: 7px 16px; cursor: pointer; border: 1px solid var(--accent); }
.btn.solid { background: var(--accent); color: #fff; }

@media (max-width: 760px) {
  .nav { display: none; }
  .search, .user { display: none; }
  main { padding: 16px; }
  .essentials { grid-template-columns: 1fr; }
  .essentials div { grid-template-columns: 120px 1fr; }
}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">Cloud Portal</span>
  <span class="demo-badge" title="Simulated screens for a demo. Nothing here is a live cloud environment.">Demo environment</span>
  <div class="search"><input id="portal-search" type="search" placeholder="Search resources and services" aria-label="Search resources and services"></div>
  <span class="user" id="portal-user">marta.appowner</span>
</header>

<div class="shell">
  <nav class="nav" aria-label="Portal navigation">
    <a href="#/home" id="nav-home">Home</a>
    <a href="#/rg" id="nav-resource-groups">Resource groups</a>
    <a href="#/vms" id="nav-virtual-machines">Virtual machines</a>
    <span class="disabled">Cost management</span>
    <span class="disabled">Monitor</span>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>

<script>
(function () {
  // Values come from the pipeline summary link (query string); defaults keep the page usable on its own.
  var q = new URLSearchParams(location.search);
  var regionNames = { westeurope: "West Europe", northeurope: "North Europe", francecentral: "France Central" };
  var sizeNames = {
    Standard_B2s: "Standard B2s (2 vCPUs, 4 GiB memory)",
    Standard_D2s_v5: "Standard D2s v5 (2 vCPUs, 8 GiB memory)",
    Standard_D4s_v5: "Standard D4s v5 (4 vCPUs, 16 GiB memory)"
  };
  var d = {
    name: q.get("name") || "vm-qms-dev-01",
    rg: q.get("rg") || "rg-qms-dev",
    region: q.get("region") || "westeurope",
    size: q.get("size") || "Standard_B2s",
    cc: q.get("cc") || "CC-104233",
    app: q.get("app") || "APP-20417",
    env: q.get("env") || "dev",
    repo: q.get("repo") || "app-qms-infra",
    sub: "Easy Cloud Sandbox"
  };
  var region = regionNames[d.region] || d.region;
  var size = sizeNames[d.size] || d.size;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var views = {
    home: function () {
      return '<p class="crumbs">Home</p><h1 id="page-title">Welcome, Marta</h1>' +
        '<p class="subtitle">Recent resources</p>' +
        '<div class="panel"><div class="table-wrap"><table id="recent-resources"><thead><tr><th>Name</th><th>Type</th><th>Last viewed</th></tr></thead><tbody>' +
        '<tr><td><a href="#/vm" id="recent-vm">' + esc(d.name) + '</a></td><td>Virtual machine</td><td>Just now</td></tr>' +
        '<tr><td><a href="#/rg" id="recent-rg">' + esc(d.rg) + '</a></td><td>Resource group</td><td>Just now</td></tr>' +
        '</tbody></table></div></div>';
    },
    rg: function () {
      return '<p class="crumbs"><a href="#/home">Home</a> › Resource groups</p>' +
        '<h1 id="page-title" data-wf="rg-title">' + esc(d.rg) + '</h1><p class="subtitle">Resource group</p>' +
        '<div class="commands"><button class="cmd" disabled title="Read only: changes go through your pipeline">+ Create</button><button class="cmd" disabled>Delete resource group</button><button class="cmd" id="rg-refresh" type="button">Refresh</button></div>' +
        '<section class="panel" id="rg-essentials"><h2>Essentials</h2><dl class="essentials">' +
        '<div><dt>Subscription</dt><dd>' + esc(d.sub) + '</dd></div>' +
        '<div><dt>Location</dt><dd id="rg-location">' + esc(region) + '</dd></div>' +
        '<div><dt>Deployments</dt><dd>1 succeeded</dd></div>' +
        '<div><dt>Managed by</dt><dd>Pipeline: ' + esc(d.repo) + ' / Deploy VM</dd></div>' +
        '</dl></section>' +
        '<section class="panel"><h2>Resources</h2><div class="table-wrap"><table id="rg-resource-list"><thead><tr><th>Name</th><th>Type</th><th>Location</th></tr></thead><tbody>' +
        '<tr id="row-vm"><td><a href="#/vm" id="vm-link">' + esc(d.name) + '</a></td><td>Virtual machine</td><td>' + esc(region) + '</td></tr>' +
        '<tr><td>' + esc(d.name) + '-nic</td><td>Network interface</td><td>' + esc(region) + '</td></tr>' +
        '<tr><td>' + esc(d.name) + '_OsDisk</td><td>Disk</td><td>' + esc(region) + '</td></tr>' +
        '</tbody></table></div></section>';
    },
    vm: function () {
      return '<p class="crumbs"><a href="#/home">Home</a> › <a href="#/rg">' + esc(d.rg) + '</a></p>' +
        '<h1 id="page-title" data-wf="vm-title">' + esc(d.name) + '</h1><p class="subtitle">Virtual machine</p>' +
        '<div class="commands">' +
        '<button class="cmd" disabled title="Read only: manage this VM through your pipeline">Start</button>' +
        '<button class="cmd" disabled title="Read only: manage this VM through your pipeline">Restart</button>' +
        '<button class="cmd" disabled title="Read only: manage this VM through your pipeline">Stop</button>' +
        '<button class="cmd" disabled title="Read only: manage this VM through your pipeline">Delete</button>' +
        '<button class="cmd" id="vm-refresh" type="button">Refresh</button></div>' +
        '<section class="panel" id="vm-essentials"><h2>Essentials</h2><dl class="essentials">' +
        '<div><dt>Status</dt><dd id="vm-status" class="status-running">Running</dd></div>' +
        '<div><dt>Size</dt><dd id="vm-size">' + esc(size) + '</dd></div>' +
        '<div><dt>Location</dt><dd id="vm-location">' + esc(region) + '</dd></div>' +
        '<div><dt>Operating system</dt><dd>Linux (Ubuntu 22.04)</dd></div>' +
        '<div><dt>Resource group</dt><dd><a href="#/rg" id="vm-rg-link">' + esc(d.rg) + '</a></dd></div>' +
        '<div><dt>Public IP address</dt><dd>None (private network only)</dd></div>' +
        '<div><dt>Subscription</dt><dd>' + esc(d.sub) + '</dd></div>' +
        '<div><dt>Environment</dt><dd id="vm-env">' + esc(d.env) + '</dd></div>' +
        '</dl></section>' +
        '<section class="panel" id="vm-tags"><h2>Tags</h2><div class="tags">' +
        '<span class="tag" id="tag-costcenter"><b>CostCenter</b> : ' + esc(d.cc) + '</span>' +
        '<span class="tag" id="tag-appid"><b>AppId</b> : ' + esc(d.app) + '</span>' +
        '<span class="tag" id="tag-environment"><b>Environment</b> : ' + esc(d.env) + '</span>' +
        '<span class="tag" id="tag-managedby"><b>ManagedBy</b> : pipeline</span>' +
        '</div></section>';
    },
    vms: function () {
      return '<p class="crumbs"><a href="#/home">Home</a></p><h1 id="page-title">Virtual machines</h1><p class="subtitle">' + esc(d.sub) + '</p>' +
        '<div class="commands"><button class="cmd primary" id="btn-create-vm" type="button">+ Create</button><button class="cmd" id="vms-refresh" type="button">Refresh</button></div>' +
        '<section class="panel"><div class="table-wrap"><table id="vm-list"><thead><tr><th>Name</th><th>Resource group</th><th>Location</th><th>Status</th><th>Size</th></tr></thead><tbody>' +
        '<tr><td><a href="#/vm" id="vm-list-link">' + esc(d.name) + '</a></td><td>' + esc(d.rg) + '</td><td>' + esc(region) + '</td><td class="status-running">Running</td><td>' + esc(d.size) + '</td></tr>' +
        '</tbody></table></div></section>';
    },
    create: function () {
      return '<p class="crumbs"><a href="#/home">Home</a> › <a href="#/vms">Virtual machines</a></p><h1 id="page-title">Create a virtual machine</h1><p class="subtitle">Basics</p>' +
        '<div class="tabs" role="presentation"><span class="on">Basics</span><span>Disks</span><span>Networking</span><span>Tags</span><span>Review + create</span></div>' +
        '<div class="form" id="create-vm-form">' +
        '<label>Subscription<select id="create-subscription"><option>' + esc(d.sub) + '</option></select></label>' +
        '<label>Resource group<select id="create-rg"><option>' + esc(d.rg) + '</option></select></label>' +
        '<label>Virtual machine name<input id="create-vm-name" type="text" autocomplete="off"></label>' +
        '<label>Region<select id="create-region"><option>West Europe</option><option>North Europe</option><option>France Central</option></select></label>' +
        '<label>Size<select id="create-size"><option>Standard B2s</option><option>Standard D2s v5</option><option>Standard D4s v5</option></select></label>' +
        '<div><button class="btn solid" id="btn-review-create" type="button">Review + create</button></div>' +
        '<p id="create-result" class="note" hidden>This demo page does not create anything. On the platform, VMs are deployed through the Deploy VM pipeline.</p>' +
        '</div>';
    }
  };

  function render() {
    var route = (location.hash.replace(/^#\/?/, "") || "home").split("?")[0];
    if (!views[route]) route = "home";
    var view = document.getElementById("view");
    view.innerHTML = views[route]();
    document.title = (document.getElementById("page-title") || {}).textContent + " · Cloud Portal (demo)";
    var navMap = { home: "nav-home", rg: "nav-resource-groups", vm: "nav-virtual-machines", vms: "nav-virtual-machines", create: "nav-virtual-machines" };
    document.querySelectorAll(".nav a").forEach(function (a) { a.removeAttribute("aria-current"); });
    var cur = document.getElementById(navMap[route]);
    if (cur) cur.setAttribute("aria-current", "page");
    document.body.setAttribute("data-route", route);

    var create = document.getElementById("btn-create-vm");
    if (create) create.addEventListener("click", function () { location.hash = "#/create"; });
    var rc = document.getElementById("btn-review-create");
    if (rc) rc.addEventListener("click", function () { document.getElementById("create-result").hidden = false; });
    view.focus({ preventScroll: true });
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
